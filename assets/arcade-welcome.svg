<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title">
<title id="title">Welcome to my profile</title>
<defs>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#343d32" stroke-width="1"/></pattern>
 <pattern id="lines" width="1" height="5" patternUnits="userSpaceOnUse"><path d="M0 0H1" stroke="#111611" opacity=".4"/></pattern>
 <filter id="glow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
 <style>
 @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.9} }
 @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
 .glow{animation:pulse 2.8s ease-in-out infinite}
 .cursor{animation:blink 1.2s step-end infinite}
 @media(prefers-reduced-motion:reduce){.glow,.cursor{animation:none}}
 </style>
</defs>
<rect width="960" height="220" rx="16" fill="#202720"/>
<rect x="1" y="1" width="958" height="218" rx="15" fill="url(#grid)"/>
<rect x="12" y="12" width="936" height="196" rx="9" fill="none" stroke="#74836a" stroke-width="2"/>
<path d="M28 53V28H53 M907 28h25v25 M28 167v25h25 M907 192h25v-25" fill="none" stroke="#9aaa8f" stroke-width="3"/>
<g text-anchor="middle" font-family="monospace">
 <text x="480" y="70" fill="#a8b79b" font-size="18" letter-spacing="5">MUNTAZIR MEHDI</text>
 <text class="glow" x="480" y="132" fill="#9caf88" filter="url(#glow)" font-weight="bold" font-size="53" textLength="760" lengthAdjust="spacingAndGlyphs">WELCOME TO MY PROFILE</text>
 <text x="480" y="132" fill="#b7c4ab" font-weight="bold" font-size="53" textLength="760" lengthAdjust="spacingAndGlyphs">WELCOME TO MY PROFILE</text>
</g>
<rect class="cursor" x="470" y="161" width="20" height="9" fill="#a8b79b"/>
<rect x="15" y="15" width="930" height="190" rx="7" fill="url(#lines)" opacity=".35"/>
</svg>
